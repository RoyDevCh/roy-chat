<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Roy Chat</title>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --line:#252a35; --text:#e6e8ee; --dim:#8b93a5;
    --accent:#4d7cfe; --user:#1e2534; --ai:#171a21;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--text); display:flex; flex-direction:column;
    font:15px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  }
  header{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    padding:12px 18px calc(12px + env(safe-area-inset-top)) 18px;
    border-bottom:1px solid var(--line); background:var(--panel); position:sticky; top:0; z-index:5;
  }
  header .brand{font-weight:600; letter-spacing:.3px}
  header .brand small{color:var(--dim); font-weight:400; margin-left:8px}
  header .actions{display:flex; gap:8px}
  button{
    background:#232836; color:var(--text); border:1px solid var(--line); border-radius:8px;
    padding:7px 13px; font-size:13px; cursor:pointer; font-family:inherit;
  }
  button:hover{background:#2b3142}
  button:disabled{opacity:.5; cursor:not-allowed}
  button.primary{background:var(--accent); border-color:var(--accent); color:#fff}
  button.primary:hover{background:#3d6ce8}
  main{
    flex:1; overflow-y:auto; padding:22px 18px 8px;
  }
  .wrap{max-width:820px; margin:0 auto; display:flex; flex-direction:column; gap:18px}
  .msg{display:flex; gap:12px}
  .msg .who{
    flex:0 0 30px; height:30px; border-radius:8px; display:grid; place-items:center;
    font-size:12px; font-weight:600; background:#232836; color:var(--dim);
  }
  .msg.user .who{background:#2a3550; color:#9db4ff}
  .msg .body{flex:1; min-width:0; white-space:pre-wrap; word-break:break-word}
  .msg .body p{margin:0 0 10px}
  .msg .body p:last-child{margin-bottom:0}
  .msg .body pre{
    background:#0b0d12; border:1px solid var(--line); border-radius:8px; padding:12px;
    overflow-x:auto; font-size:13px; margin:10px 0;
  }
  .msg .body code{font-family:ui-monospace,SFMono-Regular,Consolas,"Courier New",monospace; font-size:13px}
  .msg .body :not(pre) > code{background:#222735; padding:1px 5px; border-radius:4px}
  .reasoning{
    border-left:2px solid var(--line); padding-left:12px; color:var(--dim); font-size:13.5px;
    margin-bottom:10px; white-space:pre-wrap;
  }
  .reasoning summary{cursor:pointer; color:var(--dim); font-size:12px; user-select:none}
  .empty{color:var(--dim); text-align:center; padding:60px 10px; font-size:14px; line-height:2}
  .err{color:#ff9c9c; background:#2a1a1d; border:1px solid #4a2a2f; padding:10px 12px; border-radius:8px; font-size:13.5px}
  #composer{
    display:flex; gap:10px; align-items:flex-end; max-width:820px; width:100%; margin:0 auto;
    padding:12px 18px calc(14px + env(safe-area-inset-bottom)) 18px;
  }
  textarea{
    flex:1; resize:none; max-height:180px; min-height:44px; padding:11px 14px; border-radius:10px;
    background:var(--panel); color:var(--text); border:1px solid var(--line); font:inherit; line-height:1.5;
  }
  textarea:focus{outline:none; border-color:#3c4a6b}
  dialog{
    border:1px solid var(--line); border-radius:14px; background:var(--panel); color:var(--text);
    padding:0; width:min(520px,92vw);
  }
  dialog::backdrop{background:rgba(0,0,0,.6)}
  dialog .hd{padding:16px 18px; border-bottom:1px solid var(--line); font-weight:600}
  dialog .bd{padding:18px; display:flex; flex-direction:column; gap:14px}
  dialog .ft{padding:14px 18px; border-top:1px solid var(--line); display:flex; justify-content:flex-end; gap:8px}
  dialog .ft button{white-space:nowrap; flex:0 0 auto}
  #cfgForm{display:block; padding:0; margin:0; width:auto; max-width:none}
  label{display:flex; flex-direction:column; gap:6px; font-size:13px; color:var(--dim)}
  input,select{
    background:#0f1218; border:1px solid var(--line); color:var(--text); border-radius:8px;
    padding:9px 11px; font:inherit; font-size:14px;
  }
  input:focus,select:focus{outline:none; border-color:#3c4a6b}
  .hint{font-size:12px; color:var(--dim); line-height:1.6}
  .row{display:flex; align-items:center; gap:9px; font-size:13.5px; color:var(--text)}
  .row input[type=checkbox]{width:16px; height:16px; accent-color:var(--accent)}
  @media (max-width:640px){ main{padding:16px 12px 6px} #composer{padding:10px 12px calc(12px + env(safe-area-inset-bottom))} header{padding:10px 14px} dialog{width:94vw} }
</style>
</head>
<body>
<header>
  <div class="brand">Roy Chat <small id="modelTag">deepseek-flash</small></div>
  <div class="actions">
    <button id="btnNew" type="button">新对话</button>
    <button id="btnCfg" type="button">设置</button>
  </div>
</header>
<main id="scroller"><div class="wrap" id="msgs"></div></main>
<form id="composer">
  <textarea id="input" rows="1" placeholder="输入消息，Enter 发送，Shift+Enter 换行"></textarea>
  <button class="primary" id="send" type="submit">发送</button>
</form>

<dialog id="cfg">
  <form method="dialog" id="cfgForm">
    <div class="hd">设置</div>
    <div class="bd">
      <label>API 地址
        <input id="fBase" spellcheck="false" placeholder="https://api.deepseek.com">
      </label>
      <label>API Key
        <input id="fKey" type="password" spellcheck="false" placeholder="sk-...">
      </label>
      <label>模型
        <input id="fModel" spellcheck="false" list="modelList" placeholder="deepseek-flash">
        <datalist id="modelList">
          <option value="deepseek-flash"></option>
          <option value="deepseek-v4-pro"></option>
        </datalist>
      </label>
      <div class="row"><input id="fThink" type="checkbox"><span>开启深度思考（更慢，也更贵）</span></div>
      <div class="hint">Key 只保存在这台设备的浏览器里，除了 api.deepseek.com 不会发往任何地方。公共电脑上用完记得清掉。</div>
    </div>
    <div class="ft">
      <button type="button" id="btnClear">清空对话</button>
      <button class="primary" type="submit" id="btnSave">保存</button>
    </div>
  </form>
</dialog>

<script>
(function(){
  "use strict";

  var DEFAULTS = {
    base: "https://api.deepseek.com",
    model: "deepseek-flash",
    think: false
  };

  var K_CFG = "roychat.cfg.v1";
  var K_MSG = "roychat.msgs.v1";

  function ls(k, d){
    try { var v = localStorage.getItem(k); return v === null ? d : v; } catch(e) { return d; }
  }
  function lsSet(k, v){
    try { localStorage.setItem(k, v); } catch(e) {}
  }
  function lsDel(k){ try { localStorage.removeItem(k); } catch(e) {} }

  var cfg = DEFAULTS;
  try { Object.assign(cfg, JSON.parse(ls(K_CFG, "{}"))); } catch(e) {}
  var key = ls(K_CFG + ".key", "");
  var msgs = [];
  try { msgs = JSON.parse(ls(K_MSG, "[]")) || []; } catch(e) { msgs = []; }
  if (!Array.isArray(msgs)) msgs = [];

  var $msgs = document.getElementById("msgs");
  var $scroller = document.getElementById("scroller");
  var $input = document.getElementById("input");
  var $send = document.getElementById("send");
  var $modelTag = document.getElementById("modelTag");
  var $cfg = document.getElementById("cfg");
  var $fBase = document.getElementById("fBase");
  var $fKey = document.getElementById("fKey");
  var $fModel = document.getElementById("fModel");
  var $fThink = document.getElementById("fThink");
  var busy = false;

  function saveCfg(){
    lsSet(K_CFG, JSON.stringify({ base: cfg.base, model: cfg.model, think: cfg.think }));
    lsSet(K_CFG + ".key", key);
  }
  function saveMsgs(){
    var keep = msgs.slice(-200);
    lsSet(K_MSG, JSON.stringify(keep));
  }

  function esc(s){
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  // 极简 markdown：代码块、行内代码、加粗
  function render(text){
    var src = String(text == null ? "" : text);
    var parts = src.split(/\`\`\`/);
    var out = "";
    for (var i = 0; i < parts.length; i++){
      if (i % 2 === 1){
        var body = parts[i];
        var nl = body.indexOf("\n");
        if (nl > -1 && /^[a-zA-Z0-9+#.\-]*$/.test(body.slice(0, nl).trim())){
          body = body.slice(nl + 1);
        }
        out += "<pre><code>" + esc(body.replace(/^\n/, "")) + "</code></pre>";
      } else {
        var t = esc(parts[i]);
        t = t.replace(/`([^`]+)`/g, "<code>$1</code>");
        t = t.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
        out += t;
      }
    }
    return out;
  }

  function msgEl(role){
    var el = document.createElement("div");
    el.className = "msg " + role;
    var who = document.createElement("div");
    who.className = "who";
    who.textContent = role === "user" ? "你" : "AI";
    var body = document.createElement("div");
    body.className = "body";
    el.appendChild(who);
    el.appendChild(body);
    return { el: el, body: body };
  }

  function nearBottom(){
    return $scroller.scrollHeight - $scroller.scrollTop - $scroller.clientHeight < 120;
  }
  function scrollDown(force){
    if (force || nearBottom()) $scroller.scrollTop = $scroller.scrollHeight;
  }

  function renderAll(){
    $msgs.innerHTML = "";
    if (!msgs.length){
      var tip = document.createElement("div");
      tip.className = "empty";
      tip.innerHTML = "在这里输入问题开始对话。<br>第一次使用请点右上角「设置」填 API Key。";
      $msgs.appendChild(tip);
      return;
    }
    msgs.forEach(function(m){
      var n = msgEl(m.role === "user" ? "user" : "ai");
      n.body.innerHTML = render(m.content);
      $msgs.appendChild(n.el);
    });
    scrollDown(true);
  }

  function addErr(text){
    var d = document.createElement("div");
    d.className = "err";
    d.textContent = text;
    $msgs.appendChild(d);
    scrollDown(true);
  }

  function autoGrow(){
    $input.style.height = "auto";
    var h = Math.min($input.scrollHeight, 180);
    $input.style.height = h + "px";
  }

  async function send(){
    if (busy) return;
    var text = $input.value.trim();
    if (!text) return;
    if (!key){
      openCfg();
      return;
    }

    if (!msgs.length){ $msgs.innerHTML = ""; }

    msgs.push({ role: "user", content: text });
    var un = msgEl("user");
    un.body.innerHTML = render(text);
    $msgs.appendChild(un.el);

    $input.value = "";
    autoGrow();
    busy = true;
    $send.disabled = true;

    var an = msgEl("ai");
    var reasonBox = null;
    var reasonText = "";
    var answer = "";
    $msgs.appendChild(an.el);
    scrollDown(true);

    var body = {
      model: cfg.model,
      messages: msgs.map(function(m){ return { role: m.role, content: m.content }; }),
      stream: true
    };
    if (!cfg.think) body.thinking = { type: "disabled" };

    try {
      var base = (cfg.base || DEFAULTS.base).replace(/\/+$/, "");
      var resp = await fetch(base + "/chat/completions", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": "Bearer " + key
        },
        body: JSON.stringify(body)
      });

      if (!resp.ok){
        var raw = await resp.text();
        var msg = raw;
        try { msg = JSON.parse(raw).error.message || raw; } catch(e) {}
        throw new Error("HTTP " + resp.status + " - " + msg);
      }
      if (!resp.body || !resp.body.getReader){
        throw new Error("当前浏览器不支持流式读取，请换 Chrome / Edge / Safari 新版本");
      }

      var reader = resp.body.getReader();
      var decoder = new TextDecoder("utf-8");
      var buf = "";

      while (true){
        var chunk = await reader.read();
        if (chunk.done) break;
        buf += decoder.decode(chunk.value, { stream: true });
        var lines = buf.split("\n");
        buf = lines.pop();

        for (var i = 0; i < lines.length; i++){
          var line = lines[i].trim();
          if (!line || line.indexOf("data:") !== 0) continue;
          var payload = line.slice(5).trim();
          if (payload === "[DONE]") continue;
          var json;
          try { json = JSON.parse(payload); } catch(e) { continue; }
          if (!json.choices || !json.choices.length) continue;
          var delta = json.choices[0].delta || {};
          if (delta.reasoning_content){
            reasonText += delta.reasoning_content;
            if (!reasonBox){
              reasonBox = document.createElement("details");
              reasonBox.className = "reasoning";
              reasonBox.open = true;
              reasonBox.innerHTML = "<summary>思考过程</summary><div class='rt'></div>";
              an.body.appendChild(reasonBox);
            }
            reasonBox.querySelector(".rt").textContent = reasonText;
          }
          if (delta.content){
            answer += delta.content;
            var holder = an.body.querySelector(".ans");
            if (!holder){
              holder = document.createElement("div");
              holder.className = "ans";
              an.body.appendChild(holder);
            }
            holder.innerHTML = render(answer);
          }
          scrollDown(false);
        }
      }

      if (!answer && !reasonText) throw new Error("返回为空，可能是模型名不对，或额度用完了");

      msgs.push({ role: "assistant", content: answer });
      saveMsgs();
    } catch (e){
      var errText = e && e.message ? e.message : String(e);
      if (errText.indexOf("Failed to fetch") > -1 || errText.indexOf("NetworkError") > -1){
        errText += "\n（网络或跨域问题：检查 API 地址是否以 https:// 开头，以及是否有代理拦截）";
      }
      addErr(errText);
      if (answer) msgs.push({ role: "assistant", content: answer });
      saveMsgs();
    } finally {
      busy = false;
      $send.disabled = false;
      scrollDown(false);
      $input.focus();
    }
  }

  function openCfg(){
    $fBase.value = cfg.base;
    $fKey.value = key;
    $fModel.value = cfg.model;
    $fThink.checked = !!cfg.think;
    if (typeof $cfg.showModal === "function") $cfg.showModal();
    else $cfg.setAttribute("open", "open");
  }

  document.getElementById("btnCfg").addEventListener("click", openCfg);
  document.getElementById("btnNew").addEventListener("click", function(){
    if (busy) return;
    if (msgs.length && !confirm("清空当前对话？")) return;
    msgs = [];
    lsDel(K_MSG);
    renderAll();
  });

  document.getElementById("cfgForm").addEventListener("submit", function(){
    var b = $fBase.value.trim() || DEFAULTS.base;
    var m = $fModel.value.trim() || DEFAULTS.model;
    cfg.base = b.replace(/\/+$/, "");
    cfg.model = m;
    cfg.think = $fThink.checked;
    key = $fKey.value.trim();
    saveCfg();
    $modelTag.textContent = cfg.model;
  });

  document.getElementById("btnClear").addEventListener("click", function(){
    msgs = [];
    lsDel(K_MSG);
    renderAll();
  });

  document.getElementById("composer").addEventListener("submit", function(ev){
    ev.preventDefault();
    send();
  });

  $input.addEventListener("keydown", function(ev){
    if (ev.key === "Enter" && !ev.shiftKey && !ev.isComposing){
      ev.preventDefault();
      send();
    }
  });
  $input.addEventListener("input", autoGrow);

  $modelTag.textContent = cfg.model;
  renderAll();
  autoGrow();
  if (!key) setTimeout(openCfg, 400);
})();
</script>
</body>
</html>
